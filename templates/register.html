{% extends 'base.html' %}
{% block title %}Register | E-Gov Portal{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-user-plus auth-icon"></i>
            <h2>Create Account</h2>
            <p>Join the E-Government Portal</p>
        </div>
        <form method="POST">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Full Name / Username</label>
                <input type="text" name="username" required placeholder="John Smith">
            </div>
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" required placeholder="Create a password">
            </div>
            <button type="submit" class="btn-primary full-width"><i class="fas fa-user-plus"></i> Register</button>
        </form>
        <p class="auth-link">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
</div>
{% endblock %}
