{% extends 'base.html' %}
{% block title %}Feedback | E-Gov Portal{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card wider">
        <div class="auth-header">
            <i class="fas fa-star auth-icon gold"></i>
            <h2>Share Your Feedback</h2>
            <p>Help us improve our services</p>
        </div>
        <form method="POST">
            <div class="form-group">
                <label>How would you rate your experience?</label>
                <div class="star-rating">
                    <input type="radio" name="rating" value="5" id="s5"><label for="s5">★</label>
                    <input type="radio" name="rating" value="4" id="s4"><label for="s4">★</label>
                    <input type="radio" name="rating" value="3" id="s3"><label for="s3">★</label>
                    <input type="radio" name="rating" value="2" id="s2"><label for="s2">★</label>
                    <input type="radio" name="rating" value="1" id="s1"><label for="s1">★</label>
                </div>
            </div>
            <div class="form-group">
                <label>Additional Comments (optional)</label>
                <textarea name="comment" rows="5" placeholder="Tell us about your experience..."></textarea>
            </div>
            <button type="submit" class="btn-primary full-width"><i class="fas fa-paper-plane"></i> Submit Feedback</button>
        </form>
    </div>
</div>
{% endblock %}
