{% extends 'base.html' %}
{% block title %}Login | E-Gov Portal{% endblock %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fas fa-landmark auth-icon"></i>
            <h2>Sign In</h2>
            <p>Access your E-Government Portal</p>
        </div>
        <form method="POST">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> Email Address</label>
                <input type="email" name="email" required placeholder="your@email.com">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" name="password" required placeholder="Your password">
            </div>
            <button type="submit" class="btn-primary full-width"><i class="fas fa-sign-in-alt"></i> Login</button>
        </form>
        <p class="auth-link">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
        <div class="demo-creds">
            <p><strong>Demo Admin:</strong> admin@egov.gov.au / admin123</p>
        </div>
    </div>
</div>
{% endblock %}
